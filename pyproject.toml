[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "harako-gpu"
version = "0.1.0a1"
description = "Source-available GPU-assisted RNA-seq workflow for qualified research environments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "streamlit==1.60.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9", "playwright==1.62.0"]

[project.scripts]
harako-gpu = "harako_gpu.commands.root:app"

[tool.hatch.build.targets.wheel]
packages = ["src/harako_gpu"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
