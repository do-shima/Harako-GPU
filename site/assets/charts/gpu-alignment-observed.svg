<svg xmlns="http://www.w3.org/2000/svg" role="img" viewBox="0 0 760 244" aria-labelledby="title desc"><title id="title">Observed full-human alignment resource envelope</title><desc id="desc">Peak host RAM was 49.35 GiB for one-pass and 57.42 GiB for two-pass; the isolated two-pass Parabricks task took 850 seconds. One-pass isolated time was unavailable.</desc><style>.label{font:600 15px system-ui;fill:#15211d}.value{font:700 14px system-ui;fill:#15211d}.heading{font:700 20px system-ui;fill:#15211d}</style><text x="16" y="34" class="heading">Observed full-human alignment resource envelope</text><text x="16" y="94" class="label">One-pass peak host RAM</text><rect x="230" y="72" width="165.79" height="28" fill="#176b52" stroke="#0d4b39" /><text x="405.79" y="93" class="value">49.35 GiB</text><text x="16" y="156" class="label">Two-pass peak host RAM</text><rect x="230" y="134" width="192.91" height="28" fill="#176b52" stroke="#0d4b39" /><text x="432.91" y="155" class="value">57.42 GiB</text></svg>
